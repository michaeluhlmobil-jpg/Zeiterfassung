<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Watch Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="24" stroke-opacity="0.2" />

  <!-- Active Progress Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="24"
    stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="300"
    transform="rotate(-90 256 256)" filter="url(#dropShadow)" />

  <!-- Center Clock Face Inner Circle -->
  <circle cx="256" cy="256" r="124" fill="#ffffff" filter="url(#dropShadow)" />

  <!-- Clock Hands -->
  <!-- Hour hand pointing at 9 (left) -->
  <line x1="256" y1="256" x2="185" y2="256" stroke="#1e293b" stroke-width="16" stroke-linecap="round" />
  <!-- Minute hand pointing at 1 (top right) -->
  <line x1="256" y1="256" x2="295" y2="160" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="14" fill="#1e293b" />
  <circle cx="256" cy="256" r="6" fill="#60a5fa" />

  <!-- Checkmark Badge on bottom right -->
  <g transform="translate(320, 320)">
    <circle cx="48" cy="48" r="44" fill="#16a34a" filter="url(#dropShadow)" />
    <path d="M30 48 L42 60 L66 36" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
